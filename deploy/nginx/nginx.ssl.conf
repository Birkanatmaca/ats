upstream ots_landing {
    server landing:80;
}

upstream ots_panel {
    server frontend:80;
}

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

# HTTP → HTTPS (+ ACME yenileme)
server {
    listen 80;
    server_name ogtasis.com www.ogtasis.com panel.ogtasis.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www HTTPS → apex
server {
    listen 443 ssl;
    server_name www.ogtasis.com;

    ssl_certificate /etc/letsencrypt/live/ogtasis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ogtasis.com/privkey.pem;

    return 301 https://ogtasis.com$request_uri;
}

# Landing HTTPS
server {
    listen 443 ssl;
    server_name ogtasis.com;

    ssl_certificate /etc/letsencrypt/live/ogtasis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ogtasis.com/privkey.pem;

    location / {
        proxy_pass http://ots_landing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Panel HTTPS
server {
    listen 443 ssl;
    server_name panel.ogtasis.com;

    ssl_certificate /etc/letsencrypt/live/ogtasis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ogtasis.com/privkey.pem;

    location / {
        proxy_pass http://ots_panel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# IP yedek (HTTP, port 3110)
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://ots_panel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
