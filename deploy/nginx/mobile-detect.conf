# Mobil tarayici tespiti — panel.ogtasis.com -> mobile.ogtasis.com yonlendirmesi icin
# Googlebot (ozellikle Smartphone) UA icinde "Mobile" gecer; botlari yonlendirmeyin.
map $http_user_agent $is_mobile {
    default 0;
    ~*googlebot 0;
    ~*(android|webos|iphone|ipod|ipad|blackberry|iemobile|opera\smini|mobile) 1;
}
